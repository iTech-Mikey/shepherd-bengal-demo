:600;color:var(--ink);margin-bottom:12px}.sub{color:var(--muted);font-size:17px}.about-card,.card,.cred,.contact-box{background:var(--card);border:1px solid var(--line)}.about-card{border-radius:24px;padding:32px 28px}.about-card p{color:var(--muted);margin-bottom:16px}.quote-line{margin-top:22px;padding-top:20px;border-top:1px dashed #d7e6e2;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:22px;color:var(--teal-dark);text-align:center}.services{background:var(--soft)}.cards{display:grid;gap:16px}.card{border-radius:22px;padding:26px 22px}.icon,.cred-icon{background:var(--teal-soft);color:var(--teal-dark);display:grid;place-items:center}.icon{width:50px;height:50px;border-radius:16px;margin-bottom:16px}.icon svg{width:22px;height:22px}.card h3{font-size:18px;color:var(--ink);margin-bottom:8px}.card p{font-size:15px;color:var(--muted)}.creds{display:grid;gap:14px;max-width:900px;margin:0 auto}.cred{display:flex;gap:16px;padding:22px;border-radius:18px}.cred-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0}.area{background:var(--sand);padding:56px 0;text-align:center}.contact-box{max-width:680px;margin:0 auto;text-align:center;border-radius:28px;padding:40px 24px}.contact-links{display:grid;gap:12px;margin:26px 0 8px}.phone{font-size:26px;font-weight:700;color:var(--ink)}.email{color:var(--muted)}.contact-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}.socials{display:flex;gap:10px;justify-content:center;margin-top:22px}.social{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center}.social:hover{background:var(--teal-soft);border-color:var(--teal)}.social svg{width:18px;height:18px}footer{padding:32px 0 40px;color:var(--muted);font-size:14px}.footer-inner{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.photos img,.about-phot
